<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Airbnb Room Type Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Airbnb Room Type Prediction
                    </h2>


                    {% if error %}

                    <div class="alert alert-danger">
                        <strong>Error:</strong> {{ error }}
                    </div>

                    {% endif %}


                    {% if prediction %}

                    <div class="alert alert-success text-center">

                        <h4>Predicted Room Type</h4>

                        <h2>
                            {{ prediction }}
                        </h2>

                    </div>


                    <div class="mt-4">

                        <h5>Prediction Probability</h5>

                        {% for room_type, probability in probabilities.items() %}

                        <div class="mb-3">

                            <div class="d-flex justify-content-between">

                                <span>
                                    {{ room_type }}
                                </span>

                                <span>
                                    {{ probability }}%
                                </span>

                            </div>

                            <div class="progress">

                                <div
                                    class="progress-bar"
                                    role="progressbar"
                                    style="width: {{ probability }}%;"
                                >
                                    {{ probability }}%
                                </div>

                            </div>

                        </div>

                        {% endfor %}

                    </div>

                    <hr>

                    {% endif %}


                    <form action="/predict" method="POST">


                        <!-- Latitude -->

                        <div class="mb-3">

                            <label class="form-label">
                                Latitude
                            </label>

                            <input
                                type="number"
                                step="any"
                                name="latitude"
                                class="form-control"
                                placeholder="Example: 40.7128"
                                required
                            >

                        </div>


                        <!-- Longitude -->

                        <div class="mb-3">

                            <label class="form-label">
                                Longitude
                            </label>

                            <input
                                type="number"
                                step="any"
                                name="longitude"
                                class="form-control"
                                placeholder="Example: -74.0060"
                                required
                            >

                        </div>


                        <!-- Price -->

                        <div class="mb-3">

                            <label class="form-label">
                                Price per Night
                            </label>

                            <input
                                type="number"
                                step="any"
                                min="0"
                                name="price"
                                class="form-control"
                                placeholder="Example: 150"
                                required
                            >

                        </div>


                        <!-- Minimum Nights -->

                        <div class="mb-3">

                            <label class="form-label">
                                Minimum Nights
                            </label>

                            <input
                                type="number"
                                min="1"
                                max="365"
                                name="minimum_nights"
                                class="form-control"
                                placeholder="Example: 2"
                                required
                            >

                        </div>


                        <!-- Number of Reviews -->

                        <div class="mb-3">

                            <label class="form-label">
                                Number of Reviews
                            </label>

                            <input
                                type="number"
                                min="0"
                                name="number_of_reviews"
                                class="form-control"
                                placeholder="Example: 25"
                                required
                            >

                        </div>


                        <!-- Reviews per Month -->

                        <div class="mb-3">

                            <label class="form-label">
                                Reviews per Month
                            </label>

                            <input
                                type="number"
                                step="any"
                                min="0"
                                name="reviews_per_month"
                                class="form-control"
                                placeholder="Example: 1.5"
                                required
                            >

                        </div>


                        <!-- Host Listings -->

                        <div class="mb-3">

                            <label class="form-label">
                                Host Listings Count
                            </label>

                            <input
                                type="number"
                                min="0"
                                name="calculated_host_listings_count"
                                class="form-control"
                                placeholder="Example: 3"
                                required
                            >

                        </div>


                        <!-- Availability -->

                        <div class="mb-3">

                            <label class="form-label">
                                Availability (365 Days)
                            </label>

                            <input
                                type="number"
                                min="0"
                                max="365"
                                name="availability_365"
                                class="form-control"
                                placeholder="Example: 200"
                                required
                            >

                        </div>


                        <!-- Neighbourhood Group -->

                        <div class="mb-3">

                            <label class="form-label">
                                Neighbourhood Group
                            </label>

                            <input
                                type="text"
                                name="neighbourhood_group"
                                class="form-control"
                                placeholder="Example: Manhattan"
                                required
                            >

                        </div>


                        <!-- Neighbourhood -->

                        <div class="mb-3">

                            <label class="form-label">
                                Neighbourhood
                            </label>

                            <input
                                type="text"
                                name="neighbourhood"
                                class="form-control"
                                placeholder="Example: Harlem"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 mt-3"
                        >
                            Predict Room Type
                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
